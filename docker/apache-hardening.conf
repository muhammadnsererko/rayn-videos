ServerTokens Prod
ServerSignature Off

<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory "/var/www/html/vendor">
    Require all denied
</Directory>

<Directory "/var/www/html/api">
    <Files "config.php">
        Require all denied
    </Files>
</Directory>

<FilesMatch "^(?:\..*|composer\.(?:json|lock)|Dockerfile|.*\.(?:log|sql|ini|conf))$">
    Require all denied
</FilesMatch>
